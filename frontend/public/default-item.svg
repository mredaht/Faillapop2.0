<svg width="300" height="200" viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Modern gradient background -->
    <linearGradient id="modernGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:1" />
    </linearGradient>
    
    <!-- Card gradient -->
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#f8fafc;stop-opacity:0.9" />
    </linearGradient>
    
    <!-- Icon gradient -->
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background with gradient -->
  <rect width="300" height="200" fill="url(#modernGradient)" rx="12"/>
  
  <!-- Floating geometric shapes for decoration -->
  <circle cx="50" cy="40" r="15" fill="#ffffff" opacity="0.1"/>
  <circle cx="250" cy="30" r="20" fill="#ffffff" opacity="0.08"/>
  <circle cx="280" cy="170" r="12" fill="#ffffff" opacity="0.12"/>
  <rect x="20" y="160" width="15" height="15" fill="#ffffff" opacity="0.1" rx="3"/>
  
  <!-- Main card container -->
  <rect x="40" y="50" width="220" height="100" fill="url(#cardGradient)" rx="16" stroke="#ffffff" stroke-width="1" opacity="0.9"/>
  
  <!-- Modern package icon -->
  <g transform="translate(130, 75)" filter="url(#glow)">
    <!-- Package box -->
    <rect x="0" y="10" width="40" height="30" rx="4" fill="url(#iconGradient)" stroke="#1e40af" stroke-width="1"/>
    
    <!-- Package tape/band -->
    <rect x="-2" y="20" width="44" height="8" fill="#1e40af" opacity="0.8"/>
    <rect x="15" y="5" width="10" height="40" fill="#1e40af" opacity="0.6"/>
    
    <!-- Package highlights -->
    <rect x="5" y="15" width="8" height="3" fill="#60a5fa" opacity="0.7"/>
    <rect x="5" y="30" width="12" height="2" fill="#60a5fa" opacity="0.5"/>
    
    <!-- Sparkle effects -->
    <circle cx="-10" cy="5" r="2" fill="#fbbf24" opacity="0.8"/>
    <circle cx="50" cy="15" r="1.5" fill="#fbbf24" opacity="0.6"/>
    <circle cx="45" cy="35" r="1" fill="#fbbf24" opacity="0.9"/>
  </g>
  
  <!-- Title with modern typography -->
  <text x="150" y="170" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#1e293b" font-weight="600" letter-spacing="0.5px">
    FAILLAPOP MARKETPLACE
  </text>
  
  <!-- Subtitle -->
  <text x="150" y="185" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#64748b" font-weight="400" opacity="0.8">
    Upload an image to showcase your item
  </text>
  
  <!-- Decorative dots -->
  <circle cx="110" cy="185" r="1" fill="#94a3b8" opacity="0.5"/>
  <circle cx="190" cy="185" r="1" fill="#94a3b8" opacity="0.5"/>
</svg> 